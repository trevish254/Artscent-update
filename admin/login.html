<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Sign In | ArtScent Luxury Parfums</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ArtScent Executive Management Portal Sign In." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #090d16 50%, #030712 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      color: #f8fafc;
    }

    /* Ambient background glowing orbs */
    .glow-orb-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74, 92, 255, 0.25) 0%, rgba(74, 92, 255, 0) 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
      filter: blur(40px);
      animation: floatOrb 12s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, rgba(217, 119, 6, 0) 70%);
      bottom: -150px;
      left: -150px;
      pointer-events: none;
      filter: blur(50px);
      animation: floatOrb 16s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 60px) scale(1.1); }
    }

    /* Glassmorphism Card */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 10;
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4a5cff 0%, #312e81 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin: 0 auto 16px auto;
      box-shadow: 0 8px 20px rgba(74, 92, 255, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 20px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .custom-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 13px 14px 13px 44px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .custom-input:focus {
      border-color: #4a5cff;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 3px rgba(74, 92, 255, 0.25);
    }
    .custom-input:focus + .input-icon,
    .custom-input:focus ~ .input-icon {
      color: #4a5cff;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      color: #64748b;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .password-toggle:hover {
      color: #cbd5e1;
    }

    .remember-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12.5px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      cursor: pointer;
    }
    .checkbox-label input {
      accent-color: #4a5cff;
      width: 15px;
      height: 15px;
    }

    .forgot-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .forgot-link:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4a5cff 0%, #3644cc 100%);
      color: #ffffff;
      border: none;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(74, 92, 255, 0.35);
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(74, 92, 255, 0.45);
      background: linear-gradient(135deg, #5b6bff 0%, #3f4fe0 100%);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    .quick-access-btn {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .quick-access-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .back-store-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      color: #64748b;
      text-decoration: none;
      font-size: 12.5px;
      transition: color 0.2s;
    }
    .back-store-link:hover {
      color: #cbd5e1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="../js/firebase-client.js"></script>
</head>
<body>

  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <div class="login-card">
    
    <div class="brand-logo-badge" style="background: transparent; border: none; box-shadow: none;">
      <img src="https://res.cloudinary.com/dfedn2xsg/image/upload/v1787538552/c8d4e390-e505-4afb-a15b-0e57e96bcc8e-removebg-preview_jpe5pu.png" alt="ArtScent Logo" style="height: 52px; width: auto; object-fit: contain;" />
    </div>

    <h1 class="brand-title">ArtScent Admin</h1>
    <p class="brand-subtitle" style="color: #cbd5e1; font-weight: 500;">Store Management & Staff Control Center</p>

    <!-- Clear distinction notice for customers -->
    <div style="background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 12px; padding: 12px 14px; margin-bottom: 22px; font-size: 12.5px; color: #bfdbfe; line-height: 1.5; text-align: center;">
      <span>Looking to sign in as a shopper or check out?</span><br>
      <a href="../Home/index.html" style="color: #ffffff; font-weight: 700; text-decoration: underline; display: inline-block; margin-top: 4px;">
        &larr; Return to Store & Customer Account
      </a>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="input-label" for="admin-email">Admin Email</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input 
            type="email" 
            id="admin-email" 
            class="custom-input" 
            placeholder="admin@artscent.co.ke" 
            value="admin@artscent.co.ke" 
            required 
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="input-label" for="admin-password">Password</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input 
            type="password" 
            id="admin-password" 
            class="custom-input" 
            placeholder="••••••••••••" 
            value="artscent2026" 
            required 
            autocomplete="current-password"
          />
          <span class="material-symbols-outlined password-toggle" id="toggle-pwd">visibility</span>
        </div>
      </div>

      <div class="remember-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me" checked />
          <span>Keep session active</span>
        </label>
        <a href="#" class="forgot-link" onclick="alert('Please contact the ArtScent system administrator for key reset.'); return false;">Forgot code?</a>
      </div>

      <button type="submit" class="btn-submit" id="btn-login">
        <span>Sign In to Dashboard</span>
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
      </button>

      <button type="button" class="quick-access-btn" id="btn-google-login" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); margin-top: 10px; color: #fff;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google (Firebase)
      </button>

      <button type="button" class="quick-access-btn" id="btn-quick-demo">
        <span class="material-symbols-outlined" style="font-size: 16px; color: #818cf8;">bolt</span>
        Instant Demo Admin Access
      </button>
    </form>

    <a href="../Home/index.html" class="back-store-link">
      <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
      Return to Storefront
    </a>
  </div>

  <script>
    // Password toggle
    var pwdInput = document.getElementById("admin-password");
    var toggleBtn = document.getElementById("toggle-pwd");
    toggleBtn.addEventListener("click", function() {
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        toggleBtn.textContent = "visibility_off";
      } else {
        pwdInput.type = "password";
        toggleBtn.textContent = "visibility";
      }
    });

    function performLogin() {
      var btn = document.getElementById("btn-login");
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px; animation: spin 0.8s infinite linear;">sync</span> Authenticating...';
      btn.style.opacity = "0.85";

      // Set admin session in localStorage
      localStorage.setItem("artscent_admin_session", JSON.stringify({
        authenticated: true,
        email: document.getElementById("admin-email").value,
        timestamp: Date.now()
      }));

      setTimeout(function() {
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">check</span> Access Granted!';
        btn.style.background = "#16a34a";
        setTimeout(function() {
          window.location.href = "index.html";
        }, 500);
      }, 700);
    }

    document.getElementById("admin-login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      performLogin();
    });

    document.getElementById("btn-quick-demo").addEventListener("click", function() {
      document.getElementById("admin-email").value = "admin@artscent.co.ke";
      document.getElementById("admin-password").value = "artscent2026";
      performLogin();
    });

    document.getElementById("btn-google-login").addEventListener("click", async function() {
      var btn = document.getElementById("btn-google-login");
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px; animation: spin 0.8s infinite linear;">sync</span> Connecting Google Auth...';
      btn.disabled = true;

      try {
        if (!window.firebaseAuth) {
          throw new Error("Firebase Auth not initialized");
        }
        var provider = new firebase.auth.GoogleAuthProvider();
        var result = await window.firebaseAuth.signInWithPopup(provider);
        var user = result.user;

        localStorage.setItem("artscent_admin_session", JSON.stringify({
          authenticated: true,
          email: user.email,
          uid: user.uid,
          displayName: user.displayName,
          timestamp: Date.now()
        }));

        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">check</span> Signed In with Google!';
        btn.style.background = "#16a34a";
        setTimeout(function() {
          window.location.href = "index.html";
        }, 500);
      } catch (err) {
        console.error("Google login failed:", err);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 16px; color: #ef4444;">error</span> Sign In Failed - Try Demo Access';
        setTimeout(function() {
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>Sign in with Google (Firebase)';
        }, 3000);
      }
    });
  </script>
</body>
</html>
